specVersion: "4.0"
type: application

metadata:
  name: com.invoiceui.invoiceui

resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8

builder:
  resources:
    excludes:
      - /test/**
      - /localService/**

  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: invoiceui
        relativePaths: true
        additionalFiles:
          - xs-app.json